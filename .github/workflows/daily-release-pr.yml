name: Daily Release PR (preprod → main)

on:
  schedule:
    - cron: '30 14 * * *'  # 8 PM IST (UTC+5:30) every day
  workflow_dispatch:       # manual trigger for testing / one-off runs

jobs:
  create-daily-release-pr:
    name: Create or refresh release PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for git log / rev-list

      - name: Detect changes between preprod and main
        id: diff
        run: |
          git fetch origin main preprod

          count=$(git rev-list --count origin/main..origin/preprod)
          echo "commit_count=$count" >> "$GITHUB_OUTPUT"

          if [ "$count" -gt "0" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            {
              echo "changelog<<EOF"
              git log --oneline origin/main..origin/preprod
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No differences between preprod and main — skipping PR creation."
          fi

      - name: Create or refresh release PR
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.diff.outputs.changelog }}
          COUNT: ${{ steps.diff.outputs.commit_count }}
        run: |
          set -e
          DATE=$(date '+%Y-%m-%d')
          OWNER="${{ github.repository_owner }}"

          BODY="## Daily Release — $DATE

          **$COUNT commit(s)** are queued for promotion to \`main\`.

          ### Changelog
          \`\`\`
          $CHANGELOG
          \`\`\`

          ---
          > Auto-generated by the daily release workflow at 8 PM IST.
          > A DevOps engineer must manually trigger the production pipeline after this PR is merged.
          > Do not merge if a release window has not been confirmed."

          existing=$(gh pr list --base main --head preprod --state open --json number --jq '.[0].number')

          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head preprod \
              --title "Daily Release ($DATE): preprod → main" \
              --body "$BODY" \
              --reviewer "$OWNER"
            echo "Created new release PR."
          else
            gh pr edit "$existing" \
              --title "Daily Release ($DATE): preprod → main" \
              --body "$BODY"
            gh pr comment "$existing" \
              --body "Refreshed at 8 PM IST on $DATE — **$COUNT commit(s)** now pending promotion to \`main\`."
            echo "Updated existing PR #$existing."
          fi
